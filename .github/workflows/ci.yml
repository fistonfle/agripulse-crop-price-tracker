name: CI

on:
  pull_request:
    branches: [main]
  # Run on every push to main (after a merge), so main always shows its CI status
  push:
    branches: [main]

jobs:
  backend:
    name: Backend - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agripulse
          POSTGRES_PASSWORD: agripulse
          POSTGRES_DB: agripulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agripulse -d agripulse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agripulse:agripulse@localhost:5432/agripulse_test
      JWT_SECRET: ci-test-secret
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend - lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: agripulse-api:latest
          push: false
          cache-from: type=gha,scope=agripulse-api
          cache-to: type=gha,mode=max,scope=agripulse-api
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: agripulse-web:latest
          push: false
          cache-from: type=gha,scope=agripulse-web
          cache-to: type=gha,mode=max,scope=agripulse-web
