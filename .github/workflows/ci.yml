name: CI

on:
  pull_request:
    branches: [main]
  # Run on every push to main (after a merge), so main always shows its CI status
  push:
    branches: [main]

jobs:
  backend:
    name: Backend - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agripulse
          POSTGRES_PASSWORD: agripulse
          POSTGRES_DB: agripulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agripulse -d agripulse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agripulse:agripulse@localhost:5432/agripulse_test
      JWT_SECRET: ci-test-secret
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend - lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: agripulse-api:latest
          push: false
          cache-from: type=gha,scope=agripulse-api
          cache-to: type=gha,mode=max,scope=agripulse-api
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: agripulse-web:latest
          push: false
          cache-from: type=gha,scope=agripulse-web
          cache-to: type=gha,mode=max,scope=agripulse-web

  trivy-api:
    name: Trivy API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build API image
        id: build
        run: docker build -t agripulse-api:${{ github.sha }} -f Dockerfile .

      - name: Save API scan report
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agripulse-api:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: json
          output: trivy-api.json
          exit-code: '0'

      - name: Fail on API Critical findings
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agripulse-api:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

      - name: Fail on fixable API High findings
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agripulse-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload API scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-api-report
          path: trivy-api.json
          if-no-files-found: ignore
          retention-days: 30

  trivy-web:
    name: Trivy web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build web image
        id: build
        run: docker build -t agripulse-web:${{ github.sha }} -f frontend/Dockerfile frontend

      - name: Save web scan report
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agripulse-web:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: json
          output: trivy-web.json
          exit-code: '0'

      - name: Fail on web Critical findings
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agripulse-web:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

      - name: Fail on fixable web High findings
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agripulse-web:${{ github.sha }}
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload web scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-web-report
          path: trivy-web.json
          if-no-files-found: ignore
          retention-days: 30

  checkov:
    name: Checkov Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install checkov

      # No --soft-fail: any failed check that is not skipped in .checkov.yaml
      # fails the build. Open source Checkov has no severity levels.
      - name: Scan Terraform
        run: |
          mkdir -p security-reports
          checkov \
            --directory terraform \
            --framework terraform \
            --config-file .checkov.yaml \
            --compact \
            --quiet \
            --output cli \
            --output json \
            --output-file-path console,security-reports

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: security-reports/
          if-no-files-found: ignore
          retention-days: 30
