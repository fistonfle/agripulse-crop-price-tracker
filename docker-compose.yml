# Runs the whole AgriPulse app with one command:
#
#   docker compose up --build
#
# Then open http://localhost:5173
#
# The values after ":-" are the defaults, so it works without a .env file.
# Copy .env.example to .env if you want to change them.

services:
  # ---- PostgreSQL database ----
  db:
    image: postgres:16-alpine
    container_name: agripulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agripulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agripulse}
      POSTGRES_DB: ${POSTGRES_DB:-agripulse}
    ports:
      # 5434 on your computer -> 5432 in the container (so it does not clash
      # with a PostgreSQL you may already have installed)
      - "5434:5432"
    volumes:
      # Named volume, so the data is still there after "docker compose down"
      - db-data:/var/lib/postgresql/data
      # These run once, the first time the database is created: the tables,
      # the sample prices, and the test database
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./backend/db/create-test-db.sql:/docker-entrypoint-initdb.d/03-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agripulse}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agripulse

  # ---- Express API ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agripulse-api
    container_name: agripulse-api
    restart: unless-stopped
    environment:
      PORT: 3000
      # "db" is the service name above. Docker gives every service a name on
      # the network, so the API finds the database at db:5432.
      DATABASE_URL: postgres://${POSTGRES_USER:-agripulse}:${POSTGRES_PASSWORD:-agripulse}@db:5432/${POSTGRES_DB:-agripulse}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    ports:
      - "3000:3000"
    depends_on:
      db:
        # Wait until the database really accepts connections
        condition: service_healthy
    networks:
      - agripulse

  # ---- React app served by nginx ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agripulse-web
    container_name: agripulse-web
    restart: unless-stopped
    ports:
      # 5173 is the same port as the Vite dev server, so the URL stays the same
      - "5173:8080"
    depends_on:
      backend:
        # nginx looks up "backend" when it starts, so the API must be up first
        condition: service_healthy
    networks:
      - agripulse

# The backend and frontend health checks are in their Dockerfiles

volumes:
  db-data:

networks:
  # One network for the three services. Only the ports above are open on
  # your computer; the services talk to each other inside it.
  agripulse:
