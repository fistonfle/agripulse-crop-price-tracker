# nginx config for the frontend container.
# It replaces the default one at /etc/nginx/conf.d/default.conf.

server {
  # 8080 because the unprivileged nginx user cannot use port 80
  listen 8080;

  root /usr/share/nginx/html;
  index index.html;

  # The React code calls /api/... . In development Vite forwards those to the
  # backend; here nginx does it, using the "backend" name from docker-compose.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # Single page app: send unknown paths to index.html instead of a 404
  location / {
    try_files $uri $uri/ /index.html;
  }
}
