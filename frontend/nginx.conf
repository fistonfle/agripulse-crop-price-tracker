# nginx config for the frontend container.
# It replaces the default one at /etc/nginx/conf.d/default.conf.

server {
  # 8080 because the unprivileged nginx user cannot use port 80
  listen 8080;

  root /usr/share/nginx/html;
  index index.html;

  # The React code calls /api/... . In development Vite forwards those to the
  # backend; here nginx does it, using the "backend" name from docker-compose.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # The load balancer and operators read this one. It is the API's own /health,
  # which also checks the database: 200 when all is well, 503 when the database
  # is down. If the API container is stopped nginx answers 502, so the probe
  # fails in that case too. The name is looked up again every few seconds
  # (Docker's DNS at 127.0.0.11), so the probe recovers when the API comes back
  # even if its address changed.
  location = /health {
    resolver 127.0.0.11 valid=5s;
    set $api_upstream http://backend:3000;
    proxy_pass $api_upstream/health;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    add_header Cache-Control "no-store" always;
  }

  # Single page app: send unknown paths to index.html instead of a 404
  location / {
    try_files $uri $uri/ /index.html;
  }
}
