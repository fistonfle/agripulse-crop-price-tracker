---
# Settings shared by every role. None of these are secrets.

# ---- What to deploy ----
# The CD workflow passes these with -e. The image tag is the commit SHA, so the
# VM runs exactly what CI built and pushed.
agripulse_image_tag: latest
agripulse_acr_login_server: ""
agripulse_api_image: "{{ agripulse_acr_login_server }}/agripulse-api:{{ agripulse_image_tag }}"
agripulse_web_image: "{{ agripulse_acr_login_server }}/agripulse-web:{{ agripulse_image_tag }}"

# Where the compose file and the .env file live on the VM. No source code is
# cloned any more; the VM only pulls images.
agripulse_app_dir: /opt/agripulse

# The port the website is served on. Keep it equal to app_port in terraform/variables.tf
agripulse_app_port: 5173
# The API port. It is only reachable from the VM itself (see the app role)
agripulse_api_port: 3000

# ---- Managed database ----
# Azure Database for PostgreSQL replaces the db container in production.
agripulse_database_fqdn: ""
agripulse_database_port: 5432
agripulse_postgres_user: agripulse
agripulse_postgres_db: agripulse
# Azure rejects connections that are not encrypted.
agripulse_database_sslmode: require

# ---- Secrets: read from environment variables on YOUR computer ----
# They are written to the VM's .env file (mode 0600) and never to this repository.
# The playbook stops early if they are missing or too weak.
agripulse_postgres_password: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_POSTGRES_PASSWORD') }}"
agripulse_jwt_secret: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_JWT_SECRET') }}"

# Built from the parts above. The password is URL-safe, which the playbook checks.
agripulse_database_url: >-
  postgres://{{ agripulse_postgres_user }}:{{ agripulse_postgres_password }}@{{ agripulse_database_fqdn }}:{{
  agripulse_database_port }}/{{ agripulse_postgres_db }}?sslmode={{ agripulse_database_sslmode }}

# ---- Team SSH access ----
# Public keys that may log in as the admin user, on the bastion and the app VM.
# Public keys are not secrets, so they belong in the repo: that way a rebuilt VM
# still lets the team in, and adding or removing someone is a reviewable change
# rather than an edit made by hand on the box.
#
# Terraform plants only the first key (var.admin_ssh_public_key) because
# admin_ssh_key is ForceNew on azurerm_linux_virtual_machine - changing it there
# would destroy and recreate both VMs. These are added on top, by Ansible.
#
# To add someone: append their name and the contents of their ~/.ssh/id_ed25519.pub.
# To remove someone: delete their entry and set agripulse_team_ssh_keys_exclusive
# to true for one run, which removes every key not listed here.
agripulse_team_ssh_keys:
  - name: tabitha2005
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMEX7dQ8uYdglR55imlK5oBWgR3WPvPnfelJ6j739wR7 tabitha2005"
  - name: millowise01
    key: "ssh-rsa  millo@Millowise"

# Leave false. Setting it true makes authorized_keys contain exactly the keys
# above and nothing else, which also removes the key Terraform planted - only do
# that deliberately, and never from CI.
agripulse_team_ssh_keys_exclusive: false

# ---- Firewall and SSH ----
# Who may open an SSH connection through the VM's own firewall.
# "any" is fine because the Azure network security group already limits SSH to
# the bastion subnet. Set it to the bastion's private IP for a second layer.
agripulse_ssh_allowed_from: any
