# The application VM has no public IP, so Ansible reaches it through the
# bastion. There is ONE route, an SSH ProxyJump written in ~/.ssh/config (the
# CD job writes that file itself; for a manual run see ansible/README.md).
# Nothing is typed into this file: the address and the key come from
# environment variables.
#
#   export AGRIPULSE_VM_IP="$(terraform -chdir=../terraform output -raw app_private_ip)"
#   export AGRIPULSE_SSH_KEY=~/.ssh/agripulse_azure    # optional, this is the default
#   export AGRIPULSE_SSH_USER=azureuser                # optional, this is the default
#
# Do not add a ProxyCommand here: together with the ProxyJump it would try to
# jump through the bastion twice.
all:
  hosts:
    # Ansible's implicit localhost belongs to no group, so group_vars/all.yml
    # would not reach the checks in the first play. Listing it here fixes that.
    localhost:
      ansible_connection: local
  children:
    agripulse:
      hosts:
        agripulse-vm:
          ansible_host: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_VM_IP') }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_SSH_USER') | default('azureuser', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_SSH_KEY') | default('~/.ssh/agripulse_azure', true) }}"
          # accept-new trusts a host's key the first time and refuses if it ever
          # changes, so there is no interactive prompt.
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
