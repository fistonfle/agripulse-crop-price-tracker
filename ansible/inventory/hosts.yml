---
# The application VM has no public IP. It is reached through the bastion, so
# nothing is typed into this file: the addresses and the key come from
# environment variables.
#
#   export AGRIPULSE_VM_IP="$(terraform -chdir=../terraform output -raw app_private_ip)"
#   export AGRIPULSE_BASTION_IP="$(terraform -chdir=../terraform output -raw bastion_public_ip)"
#   export AGRIPULSE_SSH_KEY=~/.ssh/agripulse_azure    # optional, this is the default
#   export AGRIPULSE_SSH_USER=azureuser                # optional, this is the default
#
# Leave AGRIPULSE_BASTION_IP unset only when the route to the VM is already in
# your ~/.ssh/config, or when you are running from inside the virtual network.
all:
  hosts:
    # Ansible's implicit localhost belongs to no group, so group_vars/all.yml
    # would not reach the checks in the first play. Listing it here fixes that.
    localhost:
      ansible_connection: local
  children:
    agripulse:
      hosts:
        agripulse-vm:
          ansible_host: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_VM_IP') }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_SSH_USER') | default('azureuser', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_SSH_KEY') | default('~/.ssh/agripulse_azure', true) }}"
          # accept-new trusts a host's key the first time and refuses if it ever
          # changes, so there is no interactive prompt. The ProxyCommand is the
          # jump through the bastion; it disappears when no bastion is set.
          agripulse_bastion: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_BASTION_IP') }}"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=accept-new
            {% if agripulse_bastion | length > 0 %}
            -o ProxyCommand="ssh -i {{ ansible_ssh_private_key_file }} -W %h:%p
            -o StrictHostKeyChecking=accept-new {{ ansible_user }}@{{ agripulse_bastion }}"
            {% endif %}
