---
# Static inventory for the VM that Terraform creates.
#
# Nothing is typed into this file. The address and the key come from
# environment variables, so no IP address, key path or secret is committed:
#
#   export AGRIPULSE_VM_IP="$(terraform -chdir=../terraform output -raw vm_public_ip)"
#   export AGRIPULSE_SSH_KEY=~/.ssh/agripulse_azure         # optional, this is the default
#   export AGRIPULSE_SSH_USER=azureuser                      # optional, this is the default
#
# StrictHostKeyChecking=accept-new trusts the VM's key the first time you
# connect and then refuses if it ever changes, so there is no yes/no prompt.
all:
  children:
    agripulse:
      hosts:
        agripulse-vm:
          ansible_host: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_VM_IP') }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_SSH_USER') | default('azureuser', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'AGRIPULSE_SSH_KEY') | default('~/.ssh/agripulse_azure', true) }}"
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
