---
# Deploys AgriPulse on the Azure VM that Terraform created.
#
#   ansible-playbook playbook.yml
#
# It is safe to run again and again: each task only changes something when the
# VM is not already in the wanted state.

# ---- Play 1: check the inputs on your own computer before touching the VM ----
- name: Check the inputs before connecting
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Make sure the shared settings (group_vars/all.yml) were loaded
      ansible.builtin.assert:
        that:
          - agripulse_postgres_user is defined
        fail_msg: >-
          group_vars/all.yml was not loaded. Run the playbook with ansible-playbook
          from the ansible/ folder (cd ansible && ansible-playbook playbook.yml).
        quiet: true

    - name: Make sure the VM address was provided
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'AGRIPULSE_VM_IP') | length > 0
        fail_msg: >-
          AGRIPULSE_VM_IP is not set. Run:
          export AGRIPULSE_VM_IP="$(terraform -chdir=../terraform output -raw app_private_ip)"
        quiet: true

    - name: Make sure the registry and the database were provided
      ansible.builtin.assert:
        that:
          - agripulse_acr_login_server | length > 0
          - agripulse_database_fqdn | length > 0
          - agripulse_image_tag | length > 0
        fail_msg: >-
          agripulse_acr_login_server, agripulse_database_fqdn and
          agripulse_image_tag must be set. Take the first two from Terraform:
          terraform -chdir=../terraform output -raw acr_login_server
          terraform -chdir=../terraform output -raw database_fqdn
          and pass them with -e, together with the image tag to deploy.
        quiet: true

    - name: Make sure the secrets were provided and are not weak
      ansible.builtin.assert:
        that:
          - agripulse_postgres_password | length >= 16
          - agripulse_jwt_secret | length >= 16
          - agripulse_postgres_password != 'agripulse'
          - agripulse_jwt_secret != 'local-development-secret'
          - agripulse_postgres_password is match('^[A-Za-z0-9_.-]+$')
          - agripulse_jwt_secret is match('^[A-Za-z0-9_.-]+$')
        fail_msg: >-
          AGRIPULSE_POSTGRES_PASSWORD and AGRIPULSE_JWT_SECRET must be set to
          unique values of at least 16 characters (not the development defaults),
          using only letters, digits, dot, dash and underscore (the password is
          placed inside a database URL).
          Create them with: export AGRIPULSE_POSTGRES_PASSWORD="$(openssl rand -hex 16)"
        quiet: true
      no_log: true

# ---- Play 2: team SSH keys, on both machines ----
# Runs before the app play so that if someone is locked out, the fix lands
# early rather than after a long deploy.
- name: Install the team's SSH keys
  hosts: agripulse:bastion
  gather_facts: false
  tags: [ssh-keys]
  tasks:
    - name: Allow each team key to log in as the admin user
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ item.key }}"
        comment: "{{ item.name }}"
        state: present
        exclusive: false
      loop: "{{ agripulse_team_ssh_keys | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      # An empty ansible_host means the address was not exported - skip that
      # host instead of failing. With no task left to run, Ansible never opens
      # a connection to it.
      when:
        - ansible_host | default('') | length > 0
        - not (agripulse_team_ssh_keys_exclusive | default(false) | bool)

    # Separate task because "exclusive" has to be set on the first key only;
    # looping with exclusive: true would leave just the last key in the file.
    - name: Replace authorized_keys with exactly the team keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ agripulse_team_ssh_keys | map(attribute='key') | join('\n') }}"
        state: present
        exclusive: true
      when:
        - ansible_host | default('') | length > 0
        - agripulse_team_ssh_keys_exclusive | default(false) | bool

# ---- Play 3: configure the VM ----
- name: Configure the AgriPulse VM
  hosts: agripulse
  become: true
  # The roles do not use gathered facts, so skip the slow fact gathering
  gather_facts: false
  roles:
    # 1. Docker and the tools the app needs
    - role: docker
      tags: [docker]
    # 2. Firewall and SSH hardening (before the deploy, so problems show early)
    - role: security
      tags: [security]
    # 3. Sign in to the registry, pull the images, start them, check they work
    - role: app
      tags: [app]
