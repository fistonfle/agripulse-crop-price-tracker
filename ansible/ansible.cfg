# Ansible settings for this folder. Run ansible commands from inside ansible/
# so this file is picked up.

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Do not litter the folder with *.retry files
retry_files_enabled = False
# Use whatever Python 3 the VM has, without a warning
interpreter_python = auto_silent

[ssh_connection]
# Fewer SSH round trips, so runs are faster
pipelining = True
