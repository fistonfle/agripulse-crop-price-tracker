---
# Pulls the images the CD pipeline pushed and runs them against the managed
# database. No source code is cloned on the VM.

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ agripulse_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# ---------------- Registry sign-in ----------------
# The VM has a managed identity with the AcrPull role, so there is no registry
# password anywhere. Azure's metadata service issues a token for that identity,
# and the registry exchanges it for a short-lived docker credential.

- name: Ask the VM's managed identity for an Azure token
  ansible.builtin.uri:
    url: >-
      http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F
    headers:
      Metadata: "true"
  register: app_identity_token
  no_log: true
  changed_when: false

- name: Exchange it for a registry credential
  ansible.builtin.uri:
    url: "https://{{ agripulse_acr_login_server }}/oauth2/exchange"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: access_token
      service: "{{ agripulse_acr_login_server }}"
      access_token: "{{ app_identity_token.json.access_token }}"
  register: app_refresh_token
  no_log: true
  changed_when: false

- name: Sign in to the container registry
  community.docker.docker_login:
    registry_url: "{{ agripulse_acr_login_server }}"
    # This fixed UUID is how the registry recognises a token login.
    username: "00000000-0000-0000-0000-000000000000"
    password: "{{ app_refresh_token.json.refresh_token }}"
  no_log: true
  # The registry hands out a fresh token on every run, so docker_login would
  # always report "changed". Signing in does not alter the deployment, so it
  # is not a change and the playbook stays idempotent.
  changed_when: false

# ---------------- Configuration ----------------

- name: Write the .env file with the real secrets
  # Mode 0600: only root can read it. no_log keeps the secrets out of the output.
  ansible.builtin.template:
    src: env.j2
    dest: "{{ agripulse_app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: app_env

- name: Write the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ agripulse_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: app_compose

# ---------------- Database schema ----------------
# The schema is changed only by the numbered files in backend/db/migrations/.
# migrate.sh applies the ones this database has not seen (recorded in the
# schema_migrations table) and never drops anything. schema.sql is the
# development bootstrap and is NOT used here. The migration tool runs inside the
# postgres image, so the VM needs nothing installed. The database address and
# password travel in an environment variable, not on the command line.

- name: Copy the migration runner and the migrations
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../backend/db/{{ item }}"
    dest: "{{ agripulse_app_dir }}/"
    owner: root
    group: root
    mode: "{{ '0750' if item == 'migrate.sh' else '0640' }}"
    directory_mode: "0750"
  loop:
    - migrate.sh
    - migrations
    - seed.sql

- name: Check whether the database already has its tables
  # Asked before migrating: only a brand new database gets the sample data.
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -e
      - DATABASE_URL
      - postgres:16-alpine
      - sh
      - -c
      - psql "$DATABASE_URL" -tAc "SELECT to_regclass('public.prices') IS NOT NULL"
  environment:
    DATABASE_URL: "{{ agripulse_database_url }}"
  register: app_db_has_tables
  changed_when: false
  no_log: true

- name: Apply the database migrations that have not been applied yet
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -e
      - DATABASE_URL
      - --volume
      - "{{ agripulse_app_dir }}/migrate.sh:/migrate.sh:ro"
      - --volume
      - "{{ agripulse_app_dir }}/migrations:/migrations:ro"
      - postgres:16-alpine
      - sh
      - /migrate.sh
  environment:
    DATABASE_URL: "{{ agripulse_database_url }}"
    MIGRATIONS_DIR: /migrations
  register: app_migrations
  # migrate.sh prints one "MIGRATED:" line per file it applied, so a run with
  # nothing new reports "ok" and the playbook stays idempotent.
  changed_when: "'MIGRATED:' in app_migrations.stdout"
  no_log: true

- name: Load the sample data, only into a brand new database
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -e
      - DATABASE_URL
      - --volume
      - "{{ agripulse_app_dir }}/seed.sql:/seed.sql:ro"
      - postgres:16-alpine
      - sh
      - -c
      - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /seed.sql
  environment:
    DATABASE_URL: "{{ agripulse_database_url }}"
  when: app_db_has_tables.stdout | trim != 't'
  changed_when: true
  no_log: true

# ---------------- Run ----------------

- name: Pull the images and start the containers
  # "pull: always" makes sure a moved tag such as latest is really refreshed.
  # "wait" returns once every healthcheck passes.
  community.docker.docker_compose_v2:
    project_src: "{{ agripulse_app_dir }}"
    state: present
    pull: always
    remove_orphans: true
    wait: true
    wait_timeout: 300

# ---------------- Checks ----------------
- name: Check the API health endpoint (also tests the database)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ agripulse_api_port }}/health"
    return_content: true
  register: app_health
  until: app_health.status == 200 and app_health.json.status == 'ok'
  retries: 12
  delay: 5
  changed_when: false

- name: Check the website and the API through nginx
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ agripulse_app_port }}{{ item }}"
    status_code: 200
  loop:
    - /
    - /api/prices
  changed_when: false

- name: Confirm the running image is the one that was asked for
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{' }} .Config.Image {{ '}}' }}", agripulse-api]
  register: app_running_image
  changed_when: false
  failed_when: app_running_image.stdout | trim != agripulse_api_image

- name: List the TCP ports the VM is listening on
  ansible.builtin.command: ss -H -ltn
  register: app_listeners
  changed_when: false

- name: Confirm the API is not open to the network
  vars:
    app_public_pattern: '(0\.0\.0\.0|\*|\[::\]):{{ agripulse_api_port }}\s'
  ansible.builtin.assert:
    that:
      - app_listeners.stdout_lines | select('search', app_public_pattern) | list | length == 0
    fail_msg: The API is listening on all network interfaces.
    success_msg: Only the website port is public. The API listens on 127.0.0.1.
